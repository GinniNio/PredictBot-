name: predictbot

on:
  pull_request:
    paths: ["predictbot/**", ".github/workflows/predictbot.yml"]
  push:
    paths: ["predictbot/**", ".github/workflows/predictbot.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and integration tests (stdlib only)
        run: python -m unittest discover -s predictbot/tests -v
