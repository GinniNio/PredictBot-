name: Runtime probe

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standard-library tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build wheel (single build step)
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Generate completed release manifest
        run: |
          wheel_file="$(ls dist/*.whl)"
          python scripts/generate_manifest.py \
            --wheel "$wheel_file" \
            --commit-sha "${{ github.sha }}" \
            --output release-manifest.json
      - name: Verify manifest against the built wheel
        run: |
          wheel_file="$(ls dist/*.whl)"
          python scripts/verify_artifact.py "$wheel_file" release-manifest.json
      - name: Test offline wheel installation
        run: |
          wheel_file="$(ls dist/*.whl)"
          python -m venv runtime-test
          runtime-test/bin/python -m pip install --no-index --no-deps "$wheel_file"
          runtime-test/bin/python -m pcbf_football examples/mock-fixture.json result-a.json
          runtime-test/bin/python -m pcbf_football examples/mock-fixture.json result-b.json
          cmp result-a.json result-b.json
          cmp result-a.json examples/expected-result.json
      - name: Fresh-wheel test -- ledgers.cli validate against forecast + betting samples
        # Same installed wheel as the step above (it ships the "ledgers"
        # package too -- see pyproject.toml's own package-dir mapping).
        # Run from a directory OUTSIDE the checkout: this repo's own root
        # also contains a real ledgers/ directory, so running from
        # $GITHUB_WORKSPACE would let Python's own cwd-first sys.path
        # entry silently resolve "import ledgers" back to the checkout's
        # source instead of the installed wheel, defeating the whole
        # point of this check -- see ledgers/validation.py's own
        # importlib.resources fix and pyproject.toml's own package-data
        # entry, both added specifically because ledgers/schemas/*.json
        # was missing from the wheel before.
        run: |
          venv_python="$GITHUB_WORKSPACE/runtime-test/bin/python"
          check_dir="$RUNNER_TEMP/ledgers-wheel-check"
          mkdir -p "$check_dir"
          cd "$check_dir"
          "$venv_python" -c "import ledgers.validation as v; assert 'site-packages' in v.__file__, v.__file__"
          "$venv_python" -m ledgers.cli init --dir sample-ledger
          "$venv_python" -m ledgers.cli record-forecast --dir sample-ledger "$GITHUB_WORKSPACE/ledgers/examples/forecast_example.json"
          "$venv_python" -m ledgers.cli place-ticket --dir sample-ledger "$GITHUB_WORKSPACE/ledgers/examples/ticket_example.json"
          "$venv_python" -m ledgers.cli validate --dir sample-ledger --ledger both
      - name: Assemble host test pack
        run: |
          wheel_file="$(ls dist/*.whl)"
          mkdir -p host-test-pack
          cp "$wheel_file" host-test-pack/
          cp release-manifest.json host-test-pack/
          cp scripts/verify_artifact.py host-test-pack/
          cp docs/HOST_CONTRACT.md host-test-pack/
          cp docs/HOST_TEST_CHECKLIST.md host-test-pack/
          cp docs/HOST_TEST_RESULTS_MATRIX.md host-test-pack/
          cp examples/mock-fixture.json host-test-pack/
          cp examples/expected-result.json host-test-pack/
      - uses: actions/upload-artifact@v4
        with:
          name: pcbf-runtime-host-test-pack
          path: host-test-pack/*

  windows-wheel-smoke:
    # Confirms ledgers/locking.py's Windows (msvcrt) backend actually
    # works, on a real Windows runner -- not merely importable, but
    # exercised end-to-end via a real installed-wheel ledger command
    # outside the checkout, exactly the failure mode a Windows user hit:
    # a module-level `import fcntl` crashed EVERY settlement/writer
    # command before it ever ran, because fcntl does not exist on
    # Windows. This job must never be merged into test-and-build above --
    # a Windows-specific failure here must never block or be blocked by
    # the Linux job's own results.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tzdata (Windows ships no system IANA tz database at all -- zoneinfo.ZoneInfo("Africa/Lagos") in ingestion/kickoff.py and orchestration/bet9ja_ticket_import.py needs it just to import; see pyproject.toml's own conditional dependency)
        run: python -m pip install tzdata
      - name: Run the full standard-library test suite (exercises the real msvcrt locking backend via tests/test_ledgers_locking.py)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel into a fresh venv
        shell: pwsh
        run: |
          python -m venv runtime-test
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          runtime-test\Scripts\python.exe -m pip install --no-index --no-deps $wheel
          runtime-test\Scripts\python.exe -m pip install tzdata
      - name: ingest-football-data-org-results fails closed on a missing token -- never an ImportError on ledgers.locking
        # Run from OUTSIDE the checkout (same reasoning as the Linux job's
        # own "Fresh-wheel test" step above): this repo's own root also
        # contains a real ledgers/ directory, so running from
        # $env:GITHUB_WORKSPACE could silently resolve "import ledgers"
        # back to the checkout's source instead of the installed wheel.
        shell: pwsh
        run: |
          $venv_python = "$env:GITHUB_WORKSPACE\runtime-test\Scripts\python.exe"
          $check_dir = "$env:RUNNER_TEMP\fdo-wheel-check"
          New-Item -ItemType Directory -Force -Path $check_dir | Out-Null
          Push-Location $check_dir
          Remove-Item Env:\FOOTBALL_DATA_ORG_TOKEN -ErrorAction SilentlyContinue
          # Captured via direct assignment, never piped into a cmdlet
          # (e.g. Tee-Object) -- a downstream cmdlet in the same pipeline
          # can leave $LASTEXITCODE stale/wrong, since it only reliably
          # reflects the exit code of the last NATIVE command run.
          $output = & $venv_python -m pcbf_calculator ingest-football-data-org-results --ledger-dir ledger_data --output-dir out 2>&1
          $exit_code = $LASTEXITCODE
          Write-Host $output
          Pop-Location
          # $output from `2>&1` capture can be an ARRAY of lines --
          # -match/-notmatch against an array filters per-element (truthy
          # if ANY single line fails to match), never a whole-output
          # substring test. Flattened to one string first so this is a
          # genuine boolean "does the combined output contain this text".
          $output_text = ($output | Out-String)
          if ($exit_code -ne 2) { throw "expected exit code 2 (MISSING_TOKEN), got $exit_code" }
          if ($output_text -notmatch "MISSING_TOKEN") { throw "expected MISSING_TOKEN in output, got: $output_text" }
          if (Test-Path "$check_dir\ledger_data") { throw "ledger_data must never be created when the token is missing" }
      - name: ingest-football-data-results genuinely acquires and releases the real Windows lock end-to-end
        # A CSV with only a header (zero data rows) still runs the WHOLE
        # exclusive_ledger_lock-guarded preflight-then-commit sequence --
        # this is a real, complete msvcrt.locking acquire/release cycle
        # on Windows, not merely a successful import.
        shell: pwsh
        run: |
          $venv_python = "$env:GITHUB_WORKSPACE\runtime-test\Scripts\python.exe"
          $check_dir = "$env:RUNNER_TEMP\football-data-wheel-check"
          New-Item -ItemType Directory -Force -Path $check_dir | Out-Null
          Push-Location $check_dir
          "Div,Date,HomeTeam,AwayTeam,FTR" | Out-File -FilePath empty-results.csv -Encoding utf8
          & $venv_python -m pcbf_calculator ingest-football-data-results empty-results.csv --ledger-dir ledger_data --output-dir out
          $exit_code = $LASTEXITCODE
          Pop-Location
          if ($exit_code -ne 0) { throw "expected exit code 0, got $exit_code" }
          if (-not (Test-Path "$check_dir\out\settlement-report.json")) { throw "settlement-report.json was never written" }

  bet9ja-capture-tests:
    # Independent job: the browser_extension/bet9ja_capture/ extension is a
    # separate JS ecosystem (its own package.json) and must never gate or
    # be gated by the Python package's own test-and-build job above.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser_extension/bet9ja_capture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dev dependencies (jsdom only -- the extension itself ships zero runtime dependencies)
        run: npm ci
      - name: Run parser test suite against sanitized HTML fixtures
        run: npm test
