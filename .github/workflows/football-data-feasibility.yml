name: Football-Data feasibility (live)

# Manual invocation only for this first version — no push/pull_request/schedule
# trigger. This workflow performs a real, potentially long-running network
# download of the full 165-entry Football-Data source manifest
# (data_pipeline/sources/football_data_sources.yaml) and is not meant to run
# on every commit or PR.
on:
  workflow_dispatch:

# Read-only at the top level — this workflow only checks out the repo,
# downloads third-party CSVs into an untracked/gitignored directory, and
# uploads evidence as a build artifact. It never writes back to the repo
# (no git commit/push step) and needs no elevated permission.
permissions:
  contents: read

jobs:
  live-feasibility-run:
    runs-on: ubuntu-latest
    # Single job, single step invocation of data_pipeline/download.py's run() —
    # never a matrix over leagues/seasons. The circuit breaker
    # (HOST_BLOCK_FAILURE_THRESHOLD) keeps its cross-file "is this host
    # blocked" memory only within one process's run() call, so splitting
    # leagues/seasons across matrix jobs would silently defeat it (each job
    # would re-discover the block from scratch instead of sharing it).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run standard-library tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Record run metadata (commit, Python, runner, timestamp)
        run: |
          mkdir -p data_pipeline/reports
          python - <<'PY'
          import json
          import platform
          import subprocess
          import sys
          from datetime import datetime, timezone

          metadata = {
              "commit_sha": "${{ github.sha }}",
              "workflow_ref": "${{ github.ref }}",
              "run_id": "${{ github.run_id }}",
              "run_attempt": "${{ github.run_attempt }}",
              "run_started_at_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "python_version": sys.version,
              "python_version_output": subprocess.run(
                  [sys.executable, "--version"], capture_output=True, text=True
              ).stdout.strip()
              or subprocess.run([sys.executable, "--version"], capture_output=True, text=True).stderr.strip(),
              "runner_os": "${{ runner.os }}",
              "runner_arch": "${{ runner.arch }}",
              "platform_platform": platform.platform(),
              "platform_release": platform.release(),
              "platform_version": platform.version(),
          }
          with open("data_pipeline/reports/run_metadata.json", "w", encoding="utf-8") as fh:
              json.dump(metadata, fh, indent=2)
              fh.write("\n")
          print(json.dumps(metadata, indent=2))
          PY

      - name: Download full Football-Data source manifest (165 entries, live)
        run: python -m data_pipeline.download

      - name: Run schema inspection + validation and generate feasibility reports
        run: python -m data_pipeline.report

      - name: Build Soccer 1X2 dataset splits and generate dataset build report
        # Reads whatever data_pipeline/download.py actually retrieved above
        # (real downloads if any succeeded — never a fabricated dataset) and
        # the versioned dataset contract
        # (docs/adapters/data/soccer_1x2_dataset_contract.yaml). Produced
        # dataset row content is written only to data_pipeline/dataset/
        # (gitignored — see .gitignore's own comment on why) and never
        # uploaded; only the small evidence report below is.
        run: python -m data_pipeline.dataset_builder

      - name: Write evidence summary to job summary
        run: |
          # Note the `| tee -a "$GITHUB_STEP_SUMMARY"` below (not `>>`): a
          # step summary is only visible in the GitHub web UI and has no
          # API/log-download exposure, so a reviewer or automated check
          # reading this job's raw log would otherwise never see this
          # evidence at all. Teeing to stdout puts the exact same content
          # in the job log too.
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, ".")
          from data_pipeline.report import (
              build_rejection_reason_totals,
              format_aggregates_markdown,
              format_compact_summary_markdown,
              format_rejection_reason_totals_markdown,
          )

          report = json.loads(Path("data_pipeline/reports/feasibility_report.json").read_text(encoding="utf-8"))
          attempts_summary = report.get("source_attempts_summary", {})
          label_counts = attempts_summary.get("source_label_counts", {})
          total = attempts_summary.get("total_rows", 0)

          print("## Football-Data feasibility — live run evidence")
          print("")
          print(f"Commit `${{ github.sha }}` — {total} manifest (league, season) rows evaluated.")
          print("")
          print("| source_label | count |")
          print("|---|---:|")
          for label in ("LIVE_SOURCE_VALIDATED", "FIXTURE_ONLY_VALIDATED", "SOURCE_NOT_USABLE", "SOURCE_NOT_LISTED"):
              print(f"| {label} | {label_counts.get(label, 0)} |")
          print("")
          print(f"> {report.get('note', '')}")

          # PRIMARY reviewable evidence: this pipeline's compact
          # per-league-season summary + aggregates, rendered here so a
          # reviewer never needs to download the uploaded artifact (the
          # full JSON/Markdown reports remain in the artifact as the
          # secondary, detailed record).
          print("")
          print("### Per-league-season detail (no artifact download needed)")
          print("")
          compact_summary = report.get("compact_summary", [])
          if not compact_summary:
              print(
                  "_No league-season file was actually downloaded in this run — see the "
                  "source-attempt table above for the full attempt record._"
              )
          else:
              for line in format_compact_summary_markdown(compact_summary):
                  print(line)
          print("")
          print("### Aggregate totals")
          print("")
          for line in format_aggregates_markdown(report.get("aggregates", {"by_league": {}, "by_season": {}})):
              print(line)
          print("")
          for line in format_rejection_reason_totals_markdown(build_rejection_reason_totals(compact_summary)):
              print(line)
          PY

      - name: Write dataset-build evidence to job summary
        run: |
          # Same `tee -a "$GITHUB_STEP_SUMMARY"` pattern as the step above —
          # this evidence must be visible in both the job log and the
          # step summary without downloading the uploaded artifact.
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("data_pipeline/reports/dataset_build_report.json").read_text(encoding="utf-8"))

          print("")
          print("## Soccer 1X2 dataset build evidence")
          print("")
          print(
              f"Contract version `{report['contract_version']}` "
              f"(status: `{report['contract_status']}`). "
              f"Combined dataset snapshot hash: `{report['dataset_snapshot_sha256']}`."
          )
          print("")
          print(
              "Labels below are EXPLICITLY DISTINCT and never conflated. The first "
              "three always reconcile exactly: `source_rows == usable_settled_rows + "
              "pending_settlement_rows_included + rejected_unique_rows`. "
              "`usable_settled_rows` and `rejected_unique_rows` are THIS SPLIT'S OWN "
              "eligibility decision (never the generic, split-unaware validate_file "
              "check — a row missing a field this split never required is still "
              "usable here). `pending_settlement_rows_included` is nonzero only for "
              "split_genuine_prospective_scoring (not-yet-played fixtures admitted "
              "with a null result, per the contract's result_nullable_until_settlement "
              "field). `validation_issue_occurrences` is generic FILE-level "
              "diagnostic evidence (sum of every typed rejection reason's occurrence "
              "count), deliberately outside the three-way reconciliation. `Status` is "
              "SOURCE_UNAVAILABLE when EVERY (league, season) file this split's season "
              "list resolves to is missing under raw_dir (e.g. "
              "split_genuine_prospective_scoring's 2627 file not yet published), else "
              "BUILT — never silently substituted with another season's data."
          )
          print("")
          print("| Split | Status | Season codes | Source rows | Usable (settled) | Pending settlement | Rejected (unique) | Issue occurrences | Closing-line-benchmark label required |")
          print("|---|---|---|---:|---:|---:|---:|---:|---|")
          for split_id, split in report["splits"].items():
              totals = split["totals"]
              print(
                  f"| {split_id} | {split['status']} | {', '.join(split['season_codes']) or '(none)'} | "
                  f"{totals['source_rows']} | {totals['usable_settled_rows']} | "
                  f"{totals['pending_settlement_rows_included']} | "
                  f"{totals['rejected_unique_rows']} | {totals['validation_issue_occurrences']} | "
                  f"{split['closing_line_benchmark_model_label'] or 'no'} |"
              )
          print("")

          diag = report["season_1415_diagnostic"]
          print(f"### Season 1415 diagnostic — {diag['status']}")
          print("")
          print(f"> {diag['statement']}")
          print("")
          print("| League | 1314 vs 1415 | 1415 vs 1516 |")
          print("|---|---|---|")
          for league_code, pair_results in diag["per_league"].items():
              cells = []
              for key in ("1314_vs_1415", "1415_vs_1516"):
                  r = pair_results[key]
                  if not r.get("available"):
                      cells.append("(file not available)")
                  elif r["no_drift"]:
                      cells.append("no header drift")
                  else:
                      cells.append(f"only_in_first={r['columns_only_in_first']}, only_in_second={r['columns_only_in_second']}")
              print(f"| {league_code} | {cells[0]} | {cells[1]} |")
          print("")

          breakdown = report["season_1415_rejection_breakdown"]
          print(f"### Season 1415 rejection-reason breakdown — {breakdown['status']}")
          print("")
          print(f"> {breakdown['statement']}")
          print("")
          for league_code, league_result in breakdown["per_league"].items():
              print(f"**{league_code}**:")
              if not league_result.get("available"):
                  print("- (file not available)")
                  continue
              print(
                  f"- total_rows={league_result['total_rows']}, "
                  f"usable_fixtures={league_result['usable_fixtures']}, "
                  f"rejected_fixtures={league_result['rejected_fixtures']}"
              )
              for reason, count in league_result["rejection_reason_counts"].items():
                  print(f"  - {reason}: {count}")
              for row in league_result["rejected_row_sample"]:
                  print(
                      f"  - row {row['row_index']}: {row['home_team']} vs {row['away_team']} "
                      f"({row['date_raw']}) — {row['issues']}"
                  )
          print("")

          print("### Sanitized rejected-row sample (capped, no odds values)")
          print("")
          any_sample = False
          for split_id, split in report["splits"].items():
              sample = split["rejected_row_sample"]
              if not sample:
                  continue
              any_sample = True
              print(f"- **{split_id}**:")
              for row in sample:
                  print(
                      f"  - {row['league_code']}/{row['season_code']} row {row['row_index']}: "
                      f"{row['home_team']} vs {row['away_team']} ({row['date_raw']}) — {row['issues']}"
                  )
          if not any_sample:
              print("_No rejected rows sampled (no split had a rejected row, or no raw files were present)._")
          print("")

          print("### Split-specific rejected-row sample (capped, no odds values)")
          print("")
          print(
              "Each row here carries the exact `split_rejection_reason` THIS split's "
              "own requirements rejected it for (e.g. OPENING_PRICES_INCOMPLETE vs "
              "CLOSING_PRICES_INCOMPLETE), unlike the generic sample above which is "
              "identical across every split."
          )
          print("")
          any_split_specific_sample = False
          for split_id, split in report["splits"].items():
              sample = split["split_specific_rejected_row_sample"]
              if not sample:
                  continue
              any_split_specific_sample = True
              print(f"- **{split_id}**:")
              for row in sample:
                  print(
                      f"  - {row['league_code']}/{row['season_code']} row {row['row_index']}: "
                      f"{row['home_team']} vs {row['away_team']} ({row['date_raw']}) — {row['split_rejection_reason']}"
                  )
          if not any_split_specific_sample:
              print("_No split-specific rejected rows sampled (no split rejected a row, or no raw files were present)._")
          print("")
          print(f"> {report['note']}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: football-data-feasibility-evidence
          # Explicit file list only — never a directory glob. Raw downloaded
          # CSVs (data_pipeline/raw/, gitignored) are deliberately excluded,
          # and so is anything under data_pipeline/dataset/ (also
          # gitignored — see .gitignore's comment there): both reshape the
          # same third-party Football-Data row content and are never ours
          # to redistribute. Only retrieval metadata (hashes/timestamps/
          # URLs, no CSV content), the source-attempt/feasibility report,
          # the fixture-validation report, the dataset build report
          # (counts/hashes/diagnostic/sanitized sample, no row content),
          # and this run's metadata are uploaded.
          path: |
            data_pipeline/retrieval_log.json
            data_pipeline/reports/feasibility_report.json
            data_pipeline/reports/feasibility_report.md
            data_pipeline/reports/fixture_validation_report.json
            data_pipeline/reports/fixture_validation_report.md
            data_pipeline/reports/dataset_build_report.json
            data_pipeline/reports/dataset_build_report.md
            data_pipeline/reports/run_metadata.json
          if-no-files-found: error
