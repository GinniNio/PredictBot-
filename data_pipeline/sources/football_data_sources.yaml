# football_data_sources.yaml
#
# Source manifest for the Soccer 1X2 data-feasibility pipeline
# (docs/adapters/SOCCER_1X2_ADAPTER_SPEC.md, "Next sequence" step 2).
#
# This is a DESIGN/CONFIG artifact for data_pipeline/download.py only — it
# is not loaded by pcbf_calculator at runtime, is not a runtime registry,
# and adds no new dependency (parsed by the same dependency-free
# restricted-YAML reader as src/pcbf_calculator/registries/yamlmini.py;
# see data_pipeline/sources/manifest_loader.py).
#
# Scope: the five leagues resolved by the operator
# (SOCCER_1X2_ADAPTER_SPEC.md, "Unresolved / operator decisions" #4):
# Premier League, Bundesliga, La Liga, Serie A, Ligue 1.
#
# Football-Data.co.uk publishes one CSV per league per season at a
# predictable URL pattern:
#   https://www.football-data.co.uk/mmz4281/<season_code>/<league_code>.csv
# where <season_code> is a 4-digit code for "<end-of-first-year><end-of-
# second-year>" (e.g. season 2023-24 is "2324") and <league_code> is
# Football-Data's own per-league two/three-character code (NOT the same as
# any code used elsewhere in this repo's registries — it is specific to
# this one external source and must not be confused with, e.g., a Bet9ja
# category code).
#
# Per the resolved operator decision ("acquire every consistently
# formatted completed season available" — SOCCER_1X2_ADAPTER_SPEC.md
# "Unresolved / operator decisions" #3), this manifest expresses a SEASON
# RANGE TO ATTEMPT per league, not one hardcoded season. Football-Data's
# main-league CSVs (the five leagues here) are consistently available back
# to the 1993-94 season in this URL scheme; `first_season` below is set to
# that earliest season the site is known to serve in this format.
# download.py attempts every season in the closed range
# [first_season, latest_completed_season] and reports each attempt's
# outcome individually — a season that 404s or is not yet complete is a
# per-file failure/skip, not a reason to abort the whole run.
#
# `latest_completed_season` is intentionally a few seasons back from
# "today" in this file: a season that is still in progress is not a
# completed season, and this manifest does not try to compute "which
# season is currently live" from the clock — an operator updates this
# field each close season. Leaving it conservative here means download.py
# will simply report a 404/no-file outcome for any season attempted beyond
# what Football-Data has actually published, which is safe and legible
# either way.
#
# EXPLICIT COVERAGE GAP (do not silently omit later seasons — see the
# data_pipeline feasibility-report defect fix that added this note): as of
# this file's last edit, "today" is 2026-09-10, and by the conventional
# August-to-May European domestic-season calendar the 2024-25 season
# ("2425") and the 2025-26 season ("2526") have both already reached their
# natural completion point (a 2026-27 season would be the one currently
# in progress, not yet completed). `latest_completed_season` above is
# deliberately NOT advanced to "2526", because this download attempt runs
# in a sandbox with no live outbound access to football-data.co.uk (see
# FEASIBILITY_DECISION.md) — there is no way in this environment to
# CONFIRM the site's URL pattern for these two seasons still resolves to a
# real file (the scheme has been stable historically, but "historically
# stable" is not the same as "confirmed live"). Rather than silently
# stopping the season list at 2324 with no explanation, both seasons are
# listed explicitly below as `unconfirmed_seasons` per league — download.py
# attempts them through the IDENTICAL download/retry/circuit-breaker logic
# as every season in the confirmed [first_season, latest_completed_season]
# range (see download.py's `run()`); the only difference is that this
# manifest has not yet had a live-download-capable environment confirm
# these two seasons resolve to a real file. If an attempt against one of
# these genuinely comes back a 404 (the source confirms no file exists
# there), report.py records that as `source_label: SOURCE_NOT_LISTED` — "we
# tried, and confirmed there is no file there," never "we didn't try." Once
# a live-download-capable environment actually confirms a season's file
# resolves and validates (LIVE_SOURCE_VALIDATED), promote it into
# `latest_completed_season` and drop it from `unconfirmed_seasons`.
#
# ADDITIVE CORRECTION (dataset-contract correction, this environment's
# clock reading 2026-09-11): a real live run (commit a198162) confirmed
# season 2526 (2025-26) is now FULLY SETTLED — the 2026-27 season ("2627")
# is the actual current/in-progress season, so "2627" is added to
# `unconfirmed_seasons` below for the identical reason "2425"/"2526" were
# added — this pipeline cannot confirm from this sandbox whether
# football-data.co.uk has published a 2627 file yet. This is purely
# ADDITIVE: "2425" and "2526" are deliberately left in place (not removed
# or promoted) — only "2627" is newly appended.

categories:
  - league_code: "E0"
    league_name: "English Premier League"
    country: "England"
    url_pattern: "https://www.football-data.co.uk/mmz4281/{season_code}/E0.csv"
    file_type: "CSV"
    first_season: "9394"
    latest_completed_season: "2324"
    unconfirmed_seasons: ["2425", "2526", "2627"]

