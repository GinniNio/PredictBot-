[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbf-football"
version = "0.0.1"
description = "Dependency-free PCBF runtime compatibility probe"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pcbf-runtime-probe = "pcbf_football.runtime_probe:main"
pcbf-calculator = "pcbf_calculator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pcbf_calculator.registries.data" = ["*.yaml"]
